<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04130F"/><stop offset="0.55" stop-color="#123B32"/><stop offset="1" stop-color="#04130F"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#34D399" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
  </radialGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<ellipse cx="220" cy="180" rx="300" ry="240" fill="#34D399" opacity="0.16" filter="url(#soft)"/>
<ellipse cx="660" cy="620" rx="300" ry="260" fill="#A78BFA" opacity="0.14" filter="url(#soft)"/>

  <g>
    <path d="M 80 600 Q 220 470 360 540 T 720 430" fill="none" stroke="#34D399" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M 80 640 Q 220 510 360 580 T 720 470" fill="none" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.4"/>
    <path d="M 80 680 Q 220 550 360 620 T 720 510" fill="none" stroke="#34D399" stroke-opacity="0.16" stroke-width="1.4"/>
    <circle cx="640" cy="230" r="120" fill="url(#orb)" opacity="0.5"/>
    <circle cx="640" cy="230" r="170" fill="none" stroke="#A78BFA" stroke-opacity="0.3"/>
    <circle cx="640" cy="230" r="215" fill="none" stroke="#34D399" stroke-opacity="0.18"/>
  </g>
<rect width="800" height="800" fill="url(#vig)"/>
<rect width="800" height="800" filter="url(#grain)" opacity="0.5"/>
<rect x="1" y="1" width="798" height="798" fill="none" stroke="white" stroke-opacity="0.08"/>
<g font-family="Inter, Helvetica Neue, Arial" fill="white">
  <text x="54" y="70" font-size="15" letter-spacing="6" opacity="0.62">MUSEFLOW SESSIONS</text>
  <text x="746" y="70" font-size="15" letter-spacing="2" text-anchor="end" opacity="0.45">NO. 04</text>
  <text x="54" y="650" font-family="InterDisplay, Helvetica Neue, Arial" font-weight="700"
        font-size="74" letter-spacing="-2">Aurora Letters</text>
  <text x="56" y="700" font-size="22" letter-spacing="5" opacity="0.72">KISARAGI</text>
  <text x="56" y="746" font-size="17" letter-spacing="3" opacity="0.4">Downtempo · 极光信笺</text>
</g>
<g transform="translate(746 730)" opacity="0.6">
