<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#170615"/><stop offset="0.55" stop-color="#4A0F3C"/><stop offset="1" stop-color="#170615"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#F472B6" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
  </radialGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<ellipse cx="220" cy="180" rx="300" ry="240" fill="#F472B6" opacity="0.16" filter="url(#soft)"/>
<ellipse cx="660" cy="620" rx="300" ry="260" fill="#A78BFA" opacity="0.14" filter="url(#soft)"/>

  <g opacity="0.85">
    <circle cx="590" cy="300" r="250" fill="url(#orb)" opacity="0.55"/>
    <path d="M -80 560 C 140 430, 300 650, 520 520 S 820 430, 900 540" fill="none" stroke="#F472B6" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M -80 600 C 140 470, 300 690, 520 560 S 820 470, 900 580" fill="none" stroke="#A78BFA" stroke-opacity="0.38" stroke-width="1.4"/>
    <path d="M -80 640 C 140 510, 300 730, 520 600 S 820 510, 900 620" fill="none" stroke="#F472B6" stroke-opacity="0.25" stroke-width="1.4"/>
    <path d="M -80 680 C 140 550, 300 770, 520 640 S 820 550, 900 660" fill="none" stroke="#A78BFA" stroke-opacity="0.16" stroke-width="1.4"/>
  </g>
<rect width="800" height="800" fill="url(#vig)"/>
<rect width="800" height="800" filter="url(#grain)" opacity="0.5"/>
<rect x="1" y="1" width="798" height="798" fill="none" stroke="white" stroke-opacity="0.08"/>
<g font-family="Inter, Helvetica Neue, Arial" fill="white">
  <text x="54" y="70" font-size="15" letter-spacing="6" opacity="0.62">MUSEFLOW SESSIONS</text>
  <text x="746" y="70" font-size="15" letter-spacing="2" text-anchor="end" opacity="0.45">NO. 05</text>
  <text x="54" y="650" font-family="InterDisplay, Helvetica Neue, Arial" font-weight="700"
        font-size="74" letter-spacing="-2">Neon Rain</text>
  <text x="56" y="700" font-size="22" letter-spacing="5" opacity="0.72">MONO</text>
  <text x="56" y="746" font-size="17" letter-spacing="3" opacity="0.4">Synthwave · 霓虹雨</text>
</g>
<g transform="translate(746 730)" opacity="0.6">
