<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1411"/><stop offset="0.55" stop-color="#2C3B31"/><stop offset="1" stop-color="#0D1411"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9E8DD" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#A3B18A" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#A3B18A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
  </radialGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<ellipse cx="220" cy="180" rx="300" ry="240" fill="#D9E8DD" opacity="0.16" filter="url(#soft)"/>
<ellipse cx="660" cy="620" rx="300" ry="260" fill="#A3B18A" opacity="0.14" filter="url(#soft)"/>

  <g>
    <rect x="170" y="120" width="470" height="470" rx="60" fill="url(#orb)" opacity="0.5"/>
    <rect x="250" y="200" width="310" height="310" rx="40" fill="none" stroke="#D9E8DD" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="310" y="260" width="190" height="190" rx="26" fill="none" stroke="#A3B18A" stroke-opacity="0.45" stroke-width="1.2"/>
    <line x1="170" y1="600" x2="640" y2="120" stroke="#A3B18A" stroke-opacity="0.25"/>
    <line x1="240" y1="700" x2="710" y2="220" stroke="#D9E8DD" stroke-opacity="0.18"/>
  </g>
<rect width="800" height="800" fill="url(#vig)"/>
<rect width="800" height="800" filter="url(#grain)" opacity="0.5"/>
<rect x="1" y="1" width="798" height="798" fill="none" stroke="white" stroke-opacity="0.08"/>
<g font-family="Inter, Helvetica Neue, Arial" fill="white">
  <text x="54" y="70" font-size="15" letter-spacing="6" opacity="0.62">MUSEFLOW SESSIONS</text>
  <text x="746" y="70" font-size="15" letter-spacing="2" text-anchor="end" opacity="0.45">NO. 07</text>
  <text x="54" y="650" font-family="InterDisplay, Helvetica Neue, Arial" font-weight="700"
        font-size="74" letter-spacing="-2">Morning Mist</text>
  <text x="56" y="700" font-size="22" letter-spacing="5" opacity="0.72">ASTER</text>
  <text x="56" y="746" font-size="17" letter-spacing="3" opacity="0.4">Acoustic · 晨雾</text>
</g>
<g transform="translate(746 730)" opacity="0.6">
  <circle r="3" fill="#D9E8DD"/><circle r="9" fill="none" stroke="#D9E8DD" stroke-opacity="0.5"/>
</g>
</svg>